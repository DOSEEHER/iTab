<!doctype html>
<html lang="zh-CN" class="h-full">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 3v7.751a.25.25 0 00.407.195l2.28-1.834a.5.5 0 01.627 0l2.28 1.834a.25.25 0 00.406-.195V3'/><rect x='3' y='3' width='18' height='18' rx='2'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iTab</title>
  <meta name="description" content="iTab — 一款极简的网址导航与书签管理器。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script>
    // Prevent theme flashing before Vue mounts
    try {
      const savedTheme = localStorage.getItem('itab-theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) { }
  </script>
</head>

<body
  class="h-full bg-zinc-50 text-zinc-900 antialiased selection:bg-blue-500/20 selection:text-blue-600 dark:bg-zinc-950 dark:text-zinc-100 font-sans">
  <div id="app" class="h-full"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
